# Cut a GitHub Release when a version tag (vX.Y.Z) is pushed.
#
# The Orca plugin directory (onorca.dev) lists the newest vX.Y.Z tag and installs
# from the Git repository, so this workflow only adds a convenience zip for
# manual "local folder" installs. It refuses a tag that does not match the
# version in orca-plugin.json, package.json and src/version.ts.
# Tests use fake IPC; no Discord is required.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Check tag matches the plugin version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST="$(python3 -c "import json; print(json.load(open('orca-plugin.json'))['version'])")"
          PACKAGE="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          grep -q "PLUGIN_VERSION = '${TAG_VERSION}'" src/version.ts
          test "${MANIFEST}" = "${TAG_VERSION}"
          test "${PACKAGE}" = "${TAG_VERSION}"
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Install, test, build
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Committed build is up to date
        run: git diff --exit-code -- dist/main.js panel/index.html

      - name: Pack plugin zip
        run: |
          set -euo pipefail
          PLUGIN_DIR="rich-presence-for-discord"
          ZIP_NAME="rich-presence-for-discord-${VERSION}.zip"
          STAGE="$(mktemp -d)/${PLUGIN_DIR}"
          mkdir -p "${STAGE}/dist"
          cp orca-plugin.json LICENSE README.md "${STAGE}/"
          cp dist/main.js "${STAGE}/dist/"
          cp -R assets panel "${STAGE}/"
          rm -rf "${STAGE}/assets/screenshots/src"
          test -f "${STAGE}/orca-plugin.json"
          (cd "$(dirname "${STAGE}")" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${PLUGIN_DIR}")
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## Rich Presence for Discord ${VERSION}

          Plugin id: \`jondmarien.discord-presence\`

          ### Install

          - **From Orca's plugin directory:** <https://www.onorca.dev/plugins/jondmarien/orca-discord-presence>
          - **From Git:** Orca → Settings → Plugins → Add plugin → From a Git URL…, then paste \`https://github.com/jondmarien/orca-discord-presence#${GITHUB_REF_NAME}\`
          - **From the zip:** unzip \`${ZIP_NAME}\`, then Orca → Settings → Plugins → Add plugin → Local folder, and choose the unzipped \`rich-presence-for-discord\` folder.

          Upgrading from \`chron0.discord-presence\`: uninstall the old copy first; its settings do not carry over.

          Commit: ${GITHUB_SHA}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rich Presence for Discord ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
