# Cut a GitHub Release when a version tag (vX.Y.Z) is pushed.
#
# The Orca plugin directory (orca.dev) lists the newest vX.Y.Z tag and installs
# from the Git repository, so this workflow only adds a convenience zip for
# manual "local folder" installs. It refuses a tag that does not match the
# version in orca-plugin.json, package.json and src/version.ts.
# Tests use fake IPC; no Discord is required.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Check tag matches the plugin version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST="$(python3 -c "import json; print(json.load(open('orca-plugin.json'))['version'])")"
          PACKAGE="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          grep -q "PLUGIN_VERSION = '${TAG_VERSION}'" src/version.ts
          test "${MANIFEST}" = "${TAG_VERSION}"
          test "${PACKAGE}" = "${TAG_VERSION}"
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Install, test, build
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
          bun run build

      - name: Committed build is up to date
        run: git diff --exit-code -- dist/main.js panel/index.html

      - name: Extract changelog
        run: |
          set -euo pipefail
          python3 - "${VERSION}" <<'PY'
          import pathlib
          import sys

          version = sys.argv[1]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, l in enumerate(lines) if l.startswith(f"## [{version}]")), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no entry for {version}; add one before tagging.")
          end = start + 1
          while end < len(lines) and not lines[end].startswith("## "):
              end += 1

          highlights, details, mode = [], [], "details"
          for line in lines[start + 1:end]:
              if line.startswith("### Highlights"):
                  mode = "highlights"
                  continue
              if mode == "highlights" and line.startswith("### "):
                  mode = "details"
              (highlights if mode == "highlights" else details).append(line)

          def clean(block):
              block = list(block)
              while block and not block[0].strip():
                  block.pop(0)
              while block and not block[-1].strip():
                  block.pop()
              return block

          highlights, details = clean(highlights), clean(details)
          if not details:
              sys.exit(f"CHANGELOG.md entry for {version} is empty; add one before tagging.")

          if not highlights:
              for line in details:
                  if not line.startswith("- "):
                      continue
                  summary = line[2:].split(". ")[0].rstrip(".")
                  if len(summary) > 140:
                      summary = summary[:137] + "..."
                  highlights.append(f"- {summary}")
                  if len(highlights) == 6:
                      break
          if not highlights:
              sys.exit(f"CHANGELOG.md entry for {version} has no highlights and no bullets to summarize.")

          pathlib.Path("highlights.md").write_text("\n".join(highlights) + "\n", encoding="utf-8")
          pathlib.Path("changelog-section.md").write_text("\n".join(details) + "\n", encoding="utf-8")
          PY

      - name: Pack plugin zip
        run: |
          set -euo pipefail
          PLUGIN_DIR="rich-presence-for-discord"
          ZIP_NAME="rich-presence-for-discord-${VERSION}.zip"
          STAGE="$(mktemp -d)/${PLUGIN_DIR}"
          mkdir -p "${STAGE}/dist"
          cp orca-plugin.json LICENSE README.md "${STAGE}/"
          cp dist/main.js "${STAGE}/dist/"
          cp -R assets panel "${STAGE}/"
          rm -rf "${STAGE}/assets/screenshots/src"
          test -f "${STAGE}/orca-plugin.json"
          (cd "$(dirname "${STAGE}")" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${PLUGIN_DIR}")
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

      - name: Write release notes
        run: |
          set -euo pipefail
          {
            printf '## Rich Presence for Discord %s\n\n' "${VERSION}"
            printf 'Plugin id: `jondmarien.discord-presence`\n\n'
            printf "## What's new\n\n"
            cat highlights.md
            printf '\n<details>\n<summary><strong>All changes</strong></summary>\n\n'
            cat changelog-section.md
            printf '\n</details>\n\n'
            cat <<EOF
          ### Install

          - **From Orca's plugin directory:** <https://orca.dev/plugins/jondmarien/orca-discord-presence>
          - **From Git:** Orca → Settings → Plugins → Add plugin → From a Git URL…, then paste \`https://github.com/jondmarien/orca-discord-presence#${GITHUB_REF_NAME}\`
          - **From the zip:** unzip \`${ZIP_NAME}\`, then Orca → Settings → Plugins → Add plugin → Local folder, and choose the unzipped \`rich-presence-for-discord\` folder.

          Upgrading from \`chron0.discord-presence\`: uninstall the old copy first; its settings do not carry over.

          Commit: ${GITHUB_SHA}
          EOF
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rich Presence for Discord ${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
